name: NYXA Portable Audit and Memory CI

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "package*.json"
      - ".github/workflows/nyxa-audit-checks.yml"
  push:
    branches:
      - "hardening/audit-forward-guard-20261021"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nyxa-portable-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - name: Read-only checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Clean dependency installation
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build sources and sandbox filter
        run: npm run build
      - name: Provide the fixed Node path expected by legacy fixtures
        run: |
          if [ ! -e /usr/bin/node ]; then
            sudo ln -s -- "$(command -v node)" /usr/bin/node
          fi
          /usr/bin/node --version
      - name: Portable core and governance tests
        run: node --test tests/security.test.mjs tests/audit-forward-integrity.test.mjs tests/audit-multiprocess.test.mjs tests/candidate-store-hardening.test.mjs
      - name: MCP protocol integration
        run: npm run test:integration
      - name: Declare remaining security gate
        run: echo "PASSING THIS WORKFLOW DOES NOT VERIFY unprivileged user/mount/pid/net sandbox isolation OR host-attested NYXA memory/dreaming governance. These require a dedicated governed Linux security runner before release."
